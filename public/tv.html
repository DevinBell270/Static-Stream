<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Static Stream TV</title>
  <link rel="stylesheet" href="/tv.css" />
</head>

<body>
  <main class="tv-shell">
    <div id="player" class="player-frame" aria-label="Static Stream player"></div>
    <div id="hover-surface" class="hover-surface" aria-hidden="true"></div>

    <section id="guide-overlay" class="guide-overlay visible" aria-label="Electronic program guide">
      <header class="top-info-bar" aria-label="Current channel and player settings">
        <div class="top-info-brand">
          <span class="guide-kicker">Static Stream</span>
          <p id="current-category" class="current-category">No category selected</p>
        </div>

        <div class="top-info-main">
          <h2 id="current-title" class="current-title">Choose a category to tune in.</h2>
          <p id="current-meta" class="current-meta">
            Static Stream syncs each category to the same live timeline for every viewer.
          </p>
        </div>

        <div class="top-info-actions">
          <div class="player-controls">
            <button id="subtitle-toggle" class="control-btn" type="button" aria-pressed="false">
              <span class="control-icon">💬</span> CC Subtitles: OFF
            </button>
            <button id="mute-toggle" class="control-btn" type="button" aria-pressed="false">
              <span class="control-icon">🔊</span> Mute: OFF
            </button>
          </div>
          <a class="admin-gear-btn" href="/admin.html" aria-label="Open Admin Settings" title="Open Admin Settings">⚙</a>
        </div>
        <div id="tv-status" class="tv-status" role="status" aria-live="polite"></div>
      </header>

      <section class="epg-grid-shell">
        <div class="timebar-shell">
          <div class="timebar-label">Channels</div>
          <div id="timebar-scroll" class="timebar-scroll" aria-hidden="true">
            <div id="timebar-track" class="timebar-track"></div>
          </div>
        </div>

        <div class="grid-shell">
          <div id="guide-grid" class="guide-grid" role="grid" aria-label="Program schedule"></div>
          <div id="playhead" class="playhead" aria-hidden="true"></div>
        </div>
      </section>
    </section>
  </main>

  <aside id="stale-banner" class="stale-banner" role="alert" aria-live="assertive" hidden>
    <span class="stale-banner-icon" aria-hidden="true">⚠️</span>
    <div class="stale-banner-body">
      <strong>API Unavailable — Yesterday's Content</strong>
      <span id="stale-banner-detail">The scheduled refresh failed. Showing cached content from the last successful
        update.</span>
    </div>
    <button id="stale-banner-close" class="stale-banner-close" type="button" aria-label="Dismiss notice">✕</button>
  </aside>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/tv.js" defer></script>
</body>

</html>
